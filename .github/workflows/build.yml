name: Build Voz Lista
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCOPY_PLUGIN_AFTER_BUILD=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VozLista-VST3
          path: build/VozLista_artefacts/Release/VST3/
      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: VozLista-Standalone-exe
          path: build/VozLista_artefacts/Release/Standalone/
